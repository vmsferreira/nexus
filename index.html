<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS — Especificações de Ecrã v1.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F8FAFC;color:#1E293B;display:flex;height:100vh;overflow:hidden}
.sidebar{width:240px;background:#fff;border-right:1px solid #E2E8F0;display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sidebar-header{padding:14px 16px;border-bottom:1px solid #E2E8F0;background:linear-gradient(135deg,#FF6B35,#E55A24)}
.sidebar-brand{font-size:13px;font-weight:800;color:#fff;letter-spacing:-0.3px}
.sidebar-count{font-size:11px;color:rgba(255,255,255,0.8);margin-top:2px}
.search-box{padding:10px 12px;border-bottom:1px solid #E2E8F0}
.search-input{width:100%;padding:7px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;color:#1E293B;outline:none}
.search-input:focus{border-color:#FF6B35;box-shadow:0 0 0 2px rgba(255,107,53,0.1)}
.area-list{overflow-y:auto;flex:1}
.area-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12px;color:#64748B;transition:all 0.1s;border-left:3px solid transparent;user-select:none}
.area-item:hover{background:#F8FAFC;color:#1E293B}
.area-item.active{background:#FFF5F0;color:#FF6B35;border-left-color:#FF6B35;font-weight:600}
.area-count{margin-left:auto;background:#F1F5F9;color:#94A3B8;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{background:#fff;border-bottom:1px solid #E2E8F0;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.top-info{display:flex;flex-direction:column}
.top-area{font-size:15px;font-weight:700;color:#1E293B}
.top-sub{font-size:11px;color:#94A3B8}
.top-mockup-link{margin-left:auto;font-size:11px;color:#2563EB;text-decoration:none;background:#EFF6FF;padding:6px 12px;border-radius:8px;border:1px solid #BFDBFE;font-weight:600;white-space:nowrap}
.top-mockup-link:hover{background:#DBEAFE}
.screens-grid{flex:1;overflow-y:auto;padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;align-content:start}
/* CARD */
.sc-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;transition:box-shadow 0.15s;display:flex;flex-direction:column}
.sc-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.08);border-color:#CBD5E1}
.sc-header{padding:10px 14px;border-bottom:1px solid #F1F5F9;display:flex;gap:10px;align-items:flex-start}
.sc-id-block{flex:1;min-width:0}
.sc-id{font-size:10px;font-weight:700;color:#94A3B8;font-family:'SF Mono',Consolas,monospace;margin-bottom:2px}
.sc-name{font-size:13px;font-weight:700;color:#1E293B}
.sc-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.badge{font-size:9px;padding:2px 7px;border-radius:20px;font-weight:600;white-space:nowrap}
.sc-mockup-btn{font-size:10px;color:#2563EB;text-decoration:none;background:#EFF6FF;padding:4px 9px;border-radius:6px;border:1px solid #BFDBFE;font-weight:600;white-space:nowrap;flex-shrink:0;margin-top:2px;display:inline-block}
.sc-mockup-btn:hover{background:#DBEAFE}
.sc-body{padding:12px 14px;flex:1}
.cond-box{font-size:11px;color:#64748B;background:#F8FAFC;padding:5px 9px;border-radius:6px;margin-bottom:8px;border-left:3px solid #E2E8F0;line-height:1.4}
.sc-desc{font-size:12px;color:#475569;line-height:1.6;margin-bottom:8px}
.layout-box{display:flex;align-items:center;gap:6px;background:#F0FDF4;border-radius:6px;padding:5px 9px;margin-bottom:8px;font-size:11px;color:#166534;border:1px solid #BBF7D0}
.layout-icon{font-size:14px}
.fl{font-size:10px;font-weight:700;color:#94A3B8;letter-spacing:0.7px;text-transform:uppercase;margin-bottom:4px;margin-top:8px}
.fl-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.fl-list li{font-size:11px;color:#475569;display:flex;gap:5px;line-height:1.4;padding:2px 0}
.fl-list li::before{content:"·";color:#CBD5E1;flex-shrink:0}
.states-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:2px}
.state-item{background:#F8FAFC;border-radius:5px;padding:5px 7px;border:1px solid #E2E8F0}
.state-label{font-size:9px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.state-desc{font-size:10px;color:#475569;line-height:1.3}
.comps-row{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.comp-chip{font-size:9px;padding:2px 6px;background:#F1F5F9;border-radius:4px;color:#475569;font-family:'SF Mono',Consolas,monospace;border:1px solid #E2E8F0}
.note-box{background:#FFF8E7;border-radius:6px;padding:5px 8px;border:1px solid #FDE68A;font-size:10px;color:#92400E;margin-top:6px;line-height:1.4}
.nav-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #F1F5F9}
.nav-g{flex:1;min-width:120px}
.nav-lbl{font-size:9px;color:#94A3B8;font-weight:600;letter-spacing:0.5px;margin-bottom:3px}
.nav-chips{display:flex;flex-wrap:wrap;gap:3px}
.nav-chip{font-size:9px;padding:2px 6px;background:#F1F5F9;border-radius:4px;color:#475569;font-family:'SF Mono',Consolas,monospace}
.no-results{grid-column:1/-1;text-align:center;padding:60px;color:#94A3B8;font-size:14px}
@media(max-width:700px){.sidebar{display:none}.main{overflow:visible}}
</style>
</head>

</div>

const LL={"header_scroll": "Header fixo · Scroll", "header_scroll_fab": "Header fixo · Scroll · FAB", "header_tabs_scroll": "Header fixo · Tabs fixas · Scroll", "header_scroll_bottombar": "Header fixo · Scroll · Bottom bar fixo", "header_form_submit": "Header fixo · Form scroll · Submit fixo", "header_steps_scroll_submit": "Header fixo + barra passos · Scroll · Botão fixo", "fullscreen_center": "Full-screen centrado", "modal_overlay": "Overlay modal sobre ecrã actual", "sticky_nav_scroll": "Nav pills fixas · Scroll (Onboarding)", "split_sidebar": "Sidebar + main (Desktop)", "chat_input": "Scroll mensagens · Input fixo", "header_grid_scroll": "Header fixo · Grid scroll", "header_pills_scroll": "Header fixo · Pills filtro fixas · Scroll"};
const LP={"header_scroll": "Header fixo no topo. Área de scroll abaixo (conteúdo principal).", "header_scroll_fab": "Header fixo. Área de scroll. FAB central persistente.", "header_tabs_scroll": "Header fixo. Tabs horizontais fixas. Área de scroll abaixo das tabs.", "header_scroll_bottombar": "Header fixo. Área de scroll. Bottom bar fixa com 1-2 botões de acção.", "header_form_submit": "Header fixo. Campos de formulário em scroll. Botão de submit fixo no fundo.", "header_steps_scroll_submit": "Header fixo com barra de progresso de passos. Scroll com conteúdo do passo actual. Botão Continuar fixo no fundo.", "fullscreen_center": "Ecrã completo com conteúdo centrado verticalmente. Sem header separado.", "modal_overlay": "Overlay semi-transparente sobre o ecrã actual. Card centrado com conteúdo e botões.", "sticky_nav_scroll": "Nav pegajosa no topo (pills de navegação). Área de scroll.", "split_sidebar": "Sidebar à esquerda (navegação por área). Área principal de conteúdo à direita.", "chat_input": "Histórico de mensagens em scroll. Campo de input fixo no fundo.", "header_grid_scroll": "Header fixo. Grid de cards em scroll.", "header_pills_scroll": "Header fixo. Pills de filtro horizontais fixas. Lista em scroll."};
const COMPS={"screen-hdr": "Header do ecrã (título + back button + acções)", "scroll-area": "Área de conteúdo scrollável", "card": "Card de conteúdo padrão (branco, border, radius-lg)", "card-sm": "Card pequeno para métricas (fundo secundário)", "opt-card": "Card de selecção simples (radio) — border azul quando seleccionado", "tag-opt": "Chip de selecção múltipla (checkbox) — fundo laranja quando seleccionado", "badge": "Badge de estado (coloured pill)", "int-row": "Linha de integração: ícone colorido + título + subtítulo + acção direita", "section-hdr": "Header de secção: título + link 'Ver tudo'", "btn-primary": "Botão primário laranja (#FF6B35)", "btn-secondary": "Botão secundário cinzento escuro", "input-box": "Campo de input (fundo #1A1A1A, border #2E2E2E)", "set-row": "Linha de set de treino: número + peso×reps + RIR + estado", "avatar": "Avatar circular com iniciais ou foto", "dot": "Ponto de estado colorido (online/activo)", "pbar-track": "Barra de progresso (fundo #2E2E2E, fill colorido)", "divider": "Divisor horizontal (1px, #1E1E1E)", "fab-btn": "FAB button laranja (+ central na bottom nav)"};
const AREA_COUNTS={"auth": 4, "onboarding": 20, "core": 3, "treino": 9, "ciclismo": 4, "atletismo": 4, "wod": 3, "exercicios": 5, "programa": 13, "stats": 15, "body": 7, "saude": 7, "perfil": 7, "suplementos": 6, "equipamento": 7, "localizacao": 4, "integracoes": 7, "knowledge": 7, "achievements": 7, "comunidade": 8, "coach": 9};
const MOCKUP_URL="https://vmsferreira.github.io/nexus/";
let currentArea='all';

function getAreaColor(id){const a=AREAS.find(x=>x.id===id);return a?a.color:'#6B7280'}

function buildSidebar(){
  const list=document.getElementById('areaList');
  let html=`<div class="area-item ${currentArea==='all'?'active':''}" onclick="selectArea('all')"><span>📋</span><span>Todos</span><span class="area-count">156</span></div>`;
  AREAS.forEach(a=>{
    const cnt=AREA_COUNTS[a.id]||0;
    html+=`<div class="area-item ${currentArea===a.id?'active':''}" onclick="selectArea('${a.id}')"><span>${a.emoji}</span><span>${a.name}</span><span class="area-count">${cnt}</span></div>`;
  });
  list.innerHTML=html;
}

function selectArea(id){
  currentArea=id;
  buildSidebar();
  renderScreens();
  const a=AREAS.find(x=>x.id===id);
  document.getElementById('topLabel').textContent=a?a.emoji+' '+a.name:'Todos os ecrãs';
}

function renderScreens(){
  const q=(document.getElementById('searchGlobal').value||'').toLowerCase();
  const filtered=SCREENS.filter(s=>{
    const mA=currentArea==='all'||s.area===currentArea;
    const mQ=!q||s.id.toLowerCase().includes(q)||s.name.toLowerCase().includes(q)||(s.desc||'').toLowerCase().includes(q)||(s.elements||[]).some(e=>e.toLowerCase().includes(q));
    return mA&&mQ;
  });
  document.getElementById('topCount').textContent=filtered.length+' ecrãs';
  if(!filtered.length){document.getElementById('screensGrid').innerHTML='<div class="no-results">Sem resultados</div>';return;}
  
  const html=filtered.map(s=>{
    const ac=getAreaColor(s.area);
    const tc=TYPE_COLORS[s.type]||'#6B7280';
    const area=AREAS.find(a=>a.id===s.area);
    const eh=EH[s.id]||{};
    const layoutId=eh.layout||'';
    const layoutLabel=LL[layoutId]||'';
    const layoutDesc=LP[layoutId]||'';
    const states=eh.states||{};
    const comps=eh.components||[];
    const note=eh.note||'';
    
    const elemH=(s.elements||[]).map(e=>`<li>${e}</li>`).join('');
    const actH=(s.actions||[]).map(e=>`<li>${e}</li>`).join('');
    const statesH=Object.entries(states).map(([k,v])=>`<div class="state-item"><div class="state-label">${k}</div><div class="state-desc">${v}</div></div>`).join('');
    const compsH=comps.map(c=>`<span class="comp-chip" title="${COMPS[c]||c}">${c}</span>`).join('');
    const navFrom=(s.nav?.de||[]).map(n=>`<span class="nav-chip">${n}</span>`).join('');
    const navTo=(s.nav?.para||[]).map(n=>`<span class="nav-chip">${n}</span>`).join('');
    
    return `<div class="sc-card">
<div class="sc-header" style="border-left:4px solid ${ac}">
  <div class="sc-id-block">
    <div class="sc-id">${s.id}</div>
    <div class="sc-name">${s.name}</div>
    <div class="sc-badges">
      <span class="badge" style="background:${tc}18;color:${tc};border:1px solid ${tc}35">${s.type}</span>
      <span class="badge" style="background:${ac}12;color:${ac};border:1px solid ${ac}30">${area?.emoji} ${area?.name}</span>
    </div>
  </div>
  <a class="sc-mockup-btn" href="${MOCKUP_URL}#${s.id}" target="_blank" title="Abrir '${s.id}' no mockup">Ver →</a>
</div>
<div class="sc-body">
  <div class="cond-box">⚡ ${s.condition}</div>
  <div class="sc-desc">${s.desc}</div>
  ${layoutLabel?`<div class="layout-box"><span class="layout-icon">📐</span><span><strong>${layoutLabel}</strong> — ${layoutDesc}</span></div>`:''}
  ${elemH?`<div class="fl">Elementos UI</div><ul class="fl-list">${elemH}</ul>`:''}
  ${actH?`<div class="fl">Acções</div><ul class="fl-list">${actH}</ul>`:''}
  ${statesH?`<div class="fl">Estados</div><div class="states-grid">${statesH}</div>`:''}
  ${compsH?`<div class="fl">Componentes (Design System Sec. 28)</div><div class="comps-row">${compsH}</div>`:''}
  ${note?`<div class="note-box">⚠ ${note}</div>`:''}
  ${(navFrom||navTo)?`<div class="nav-row">
    ${navFrom?`<div class="nav-g"><div class="nav-lbl">← acedido de</div><div class="nav-chips">${navFrom}</div></div>`:''}
    ${navTo?`<div class="nav-g"><div class="nav-lbl">navega para →</div><div class="nav-chips">${navTo}</div></div>`:''}
  </div>`:''}
</div></div>`;
  }).join('');
  document.getElementById('screensGrid').innerHTML=html;
}
buildSidebar();
renderScreens();
</script>
