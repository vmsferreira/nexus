<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Hub — Mockups de UI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 20px 60px;
    color: #fff;
  }

  /* PAGE HEADER */
  .page-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .page-header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #FF6B35;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .page-header p {
    font-size: 13px;
    color: #888;
  }

  /* SCREEN PILLS */
  .nav-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 24px;
    max-width: 560px;
  }
  .pill {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #333;
    color: #888;
    font-size: 13px;
    cursor: pointer;
    background: transparent;
    transition: all .15s;
    font-family: inherit;
  }
  .pill:hover { border-color: #555; color: #ccc; }
  .pill.active { background: #FF6B35; border-color: #FF6B35; color: #fff; font-weight: 600; }

  /* PHONE FRAME */
  .phone-wrap {
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 375px;
    height: 780px;
    background: #0F0F0F;
    border-radius: 44px;
    border: 2px solid #3A3A3A;
    box-shadow: 0 32px 80px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  /* Notch */
  .notch {
    width: 120px;
    height: 28px;
    background: #0F0F0F;
    border-radius: 0 0 18px 18px;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    border-bottom: 1px solid #2A2A2A;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notch::before {
    content: '';
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #1A1A1A;
    border: 1px solid #333;
  }

  /* STATUS BAR */
  .status-bar {
    height: 44px;
    background: #0F0F0F;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 6px;
    flex-shrink: 0;
    z-index: 5;
  }
  .status-bar .time { font-size: 15px; font-weight: 600; color: #fff; }
  .status-bar .icons { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #fff; }

  /* SCREEN AREA */
  .screen { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* SCROLL AREA */
  .scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  /* BOTTOM TAB */
  .bottom-tab {
    height: 72px;
    background: #1A1A1A;
    border-top: 1px solid #2E2E2E;
    display: flex;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
    padding-bottom: 12px;
    position: relative;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    flex: 1;
    cursor: pointer;
    padding: 8px 0;
  }
  .tab-item .ti { font-size: 22px; color: #555; }
  .tab-item.active .ti { color: #FF6B35; }
  .tab-label { font-size: 10px; color: #555; }
  .tab-item.active .tab-label { color: #FF6B35; }
  .fab-btn {
    width: 56px; height: 56px;
    border-radius: 28px;
    background: #FF6B35;
    display: flex; align-items: center; justify-content: center;
    position: absolute;
    bottom: 22px; left: 50%; transform: translateX(-50%);
    box-shadow: 0 4px 16px rgba(255,107,53,0.5);
    cursor: pointer;
  }
  .fab-btn .ti { font-size: 24px; color: #fff; }

  /* COMMON COMPONENTS */
  .screen-hdr {
    padding: 12px 18px 10px;
    background: #0F0F0F;
    border-bottom: 1px solid #1E1E1E;
    flex-shrink: 0;
  }
  .card {
    background: #1A1A1A;
    border-radius: 16px;
    padding: 16px;
    margin: 0 14px 12px;
  }
  .card-sm {
    background: #242424;
    border-radius: 12px;
    padding: 10px 13px;
  }
  .hero { font-size: 40px; font-weight: 700; color: #fff; line-height: 1; }
  .title { font-size: 16px; font-weight: 600; color: #fff; }
  .subtitle { font-size: 13px; color: #999; line-height: 1.4; }
  .label {
    font-size: 11px; color: #555;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .metric-val { font-size: 24px; font-weight: 700; color: #fff; }
  .metric-unit { font-size: 12px; color: #888; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: #FF6B35;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }
  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 8px; border-radius: 10px;
    font-size: 11px; font-weight: 600;
  }
  .pbar-track { height: 5px; background: #2E2E2E; border-radius: 3px; overflow: hidden; }
  .pbar-fill { height: 100%; border-radius: 3px; }
  .divider { height: 1px; background: #1E1E1E; margin: 0 18px; }
  .section-hdr {
    padding: 14px 18px 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .input-box {
    background: #242424;
    border-radius: 10px;
    padding: 8px 12px;
    text-align: center;
    font-size: 20px; font-weight: 700; color: #fff;
    flex: 1;
  }
  .input-box.active {
    background: rgba(255,107,53,0.2);
    border: 1px solid #FF6B35;
  }
  .set-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #1E1E1E;
  }
  .set-num {
    width: 28px; height: 28px; border-radius: 14px;
    background: #2E2E2E;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #888;
    flex-shrink: 0;
  }
  .set-num.active { background: #FF6B35; color: #fff; }
  .set-num.done { background: #1A3A2A; color: #27AE60; }
  .zone-seg {
    height: 22px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; font-weight: 700;
  }
  .int-row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 18px;
  }
  .int-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .btn-primary {
    background: #FF6B35; border-radius: 14px;
    padding: 14px 22px;
    font-size: 15px; font-weight: 700; color: #fff;
    cursor: pointer; border: none; font-family: inherit;
    transition: opacity .15s;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-secondary {
    background: #1A1A1A; border-radius: 12px;
    padding: 10px 16px;
    font-size: 13px; font-weight: 600; color: #fff;
    cursor: pointer; border: 1px solid #333; font-family: inherit;
  }

  /* FOOTER */
  .page-footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: #555;
  }
  .page-footer span { color: #FF6B35; }
</style>
</head>
<body>

<div class="page-header">
  <h1>Workout Hub — UI Mockups</h1>
  <p>Arquitectura v14.0 · 7 ecrãs · Seleccione um ecrã para navegar</p>
</div>

<div class="nav-pills" id="nav-pills"></div>

<div class="phone-wrap">
  <div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="icons">
        <i class="ti ti-wifi" style="font-size:15px"></i>
        <i class="ti ti-battery-2" style="font-size:15px"></i>
      </div>
    </div>
    <div class="screen" id="screen-area"></div>
    <div class="bottom-tab" id="bottom-tab"></div>
  </div>
</div>

<div class="page-footer">
  <p>Workout Hub · Arquitectura v14.0 · Maio 2026</p>
  <p style="margin-top:4px">Mockup de referência — <span>uso interno</span></p>
</div>

<script>
const SCREENS = [
  { id: 'dashboard',   label: 'Dashboard',    tab: 'inicio' },
  { id: 'record',      label: 'Registo',       tab: 'fab' },
  { id: 'stats',       label: 'Stats',         tab: 'stats' },
  { id: 'programa',    label: 'Programa',      tab: 'programa' },
  { id: 'perfil',      label: 'Perfil',        tab: 'perfil' },
  { id: 'integracoes', label: 'Integrações',   tab: 'perfil' },
  { id: 'bodymetrics', label: 'Body Metrics',  tab: 'stats' },
];

const TABS_DEF = [
  { id: 'inicio',   icon: 'ti-home',   label: 'Início',   screen: 'dashboard' },
  { id: 'stats',    icon: 'ti-chart-bar', label: 'Stats', screen: 'stats' },
  { id: 'fab',      fab: true },
  { id: 'programa', icon: 'ti-list',   label: 'Programa', screen: 'programa' },
  { id: 'perfil',   icon: 'ti-user',   label: 'Perfil',   screen: 'perfil' },
];

let current = 'dashboard';

function setScreen(id) {
  current = id;
  renderNav();
  renderTabs(SCREENS.find(s => s.id === id).tab);
  renderScreen(id);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderNav() {
  document.getElementById('nav-pills').innerHTML = SCREENS.map(s =>
    `<button class="pill ${s.id === current ? 'active' : ''}" onclick="setScreen('${s.id}')">${s.label}</button>`
  ).join('');
}

function renderTabs(activeTab) {
  document.getElementById('bottom-tab').innerHTML = TABS_DEF.map(t => {
    if (t.fab) return `<div class="tab-item" style="position:relative;width:56px"><div class="fab-btn" onclick="setScreen('record')"><i class="ti ti-plus"></i></div></div>`;
    const active = t.id === activeTab ? 'active' : '';
    return `<div class="tab-item ${active}" onclick="setScreen('${t.screen}')"><i class="ti ${t.icon}"></i><span class="tab-label">${t.label}</span></div>`;
  }).join('');
}

function miniBar(pct, color) {
  return `<div class="pbar-track" style="flex:1"><div class="pbar-fill" style="width:${pct}%;background:${color}"></div></div>`;
}

function renderScreen(id) {
  const el = document.getElementById('screen-area');

  /* ─── DASHBOARD ─── */
  if (id === 'dashboard') {
    el.innerHTML = `
      <div class="screen-hdr row-between">
        <div class="row" style="gap:12px">
          <div class="avatar">VF</div>
          <div class="col">
            <span class="title" style="font-size:15px">Bom dia, Vitor</span>
            <span class="subtitle" style="font-size:12px">Terça, 27 de Maio</span>
          </div>
        </div>
        <div class="row" style="gap:8px">
          <span class="badge" style="background:#FF6B3520;color:#FF6B35">🔥 12 dias</span>
          <i class="ti ti-bell" style="color:#555;font-size:20px"></i>
        </div>
      </div>

      <div class="scroll-area" style="padding-top:12px">

        <!-- Readiness -->
        <div class="card" style="border:1px solid #27AE6040;background:linear-gradient(135deg,#152A1E,#1A1A1A)">
          <div class="row-between">
            <div class="col" style="gap:6px">
              <span class="label">Readiness hoje</span>
              <div class="row" style="align-items:baseline;gap:8px">
                <span class="hero" style="color:#27AE60">81</span>
                <span class="metric-unit">/ 100</span>
                <span class="badge" style="background:#27AE6020;color:#27AE60">↑ +4 vs ontem</span>
              </div>
              <span class="subtitle">Boa recuperação · HRV 58ms · Sono 7h12</span>
            </div>
            <svg width="60" height="60" viewBox="0 0 60 60">
              <circle cx="30" cy="30" r="25" fill="none" stroke="#1E2E1E" stroke-width="6"/>
              <circle cx="30" cy="30" r="25" fill="none" stroke="#27AE60" stroke-width="6"
                stroke-dasharray="127 30" stroke-dashoffset="32" stroke-linecap="round"/>
              <text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700"
                fill="#27AE60" font-family="-apple-system,sans-serif">81</text>
            </svg>
          </div>
        </div>

        <!-- Métricas do dia -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 14px;margin-bottom:12px">
          ${[
            { l:'Calorias', v:'487', u:'kcal', c:'#E67E22' },
            { l:'Passos',   v:'6.2k', u:'/ 10k', c:'#2980B9' },
            { l:'Activo',   v:'38',  u:'min',  c:'#27AE60' },
          ].map(m => `
            <div class="card-sm" style="text-align:center">
              <div class="label">${m.l}</div>
              <div style="font-size:20px;font-weight:700;color:#fff;margin:4px 0">${m.v}</div>
              <div class="metric-unit">${m.u}</div>
            </div>`).join('')}
        </div>

        <!-- Próximo treino -->
        <div class="section-hdr">
          <span class="title" style="font-size:14px">Próximo treino</span>
          <span class="subtitle" style="font-size:12px">Hoje</span>
        </div>
        <div class="card" style="border-left:3px solid #FF6B35;cursor:pointer" onclick="setScreen('record')">
          <div class="row-between">
            <div class="col" style="gap:5px">
              <div class="row" style="gap:6px">
                <span class="dot" style="background:#FF6B35"></span>
                <span class="label">Ginásio · PPL semana 4</span>
              </div>
              <span class="title">Upper Body — Push A</span>
              <span class="subtitle">Peito · Ombros · Tricep · ~45 min</span>
              <div class="row" style="gap:6px;margin-top:2px">
                <span class="badge" style="background:#2E2E2E;color:#999">4 exercícios</span>
                <span class="badge" style="background:#2E2E2E;color:#999">14 sets</span>
              </div>
            </div>
            <button class="btn-primary" style="padding:10px 16px;font-size:13px" onclick="setScreen('record')">Iniciar</button>
          </div>
        </div>

        <!-- CTL/ATL widget -->
        <div class="section-hdr">
          <span class="title" style="font-size:14px">Fitness · Fadiga · Forma</span>
          <span class="subtitle" style="font-size:12px;color:#FF6B35">Ver tudo →</span>
        </div>
        <div class="card">
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:8px;margin-bottom:12px">
            <div><div class="label">CTL (Fitness)</div><div style="font-size:22px;font-weight:700;color:#2980B9;margin-top:3px">68</div></div>
            <div><div class="label">ATL (Fadiga)</div><div style="font-size:22px;font-weight:700;color:#E67E22;margin-top:3px">72</div></div>
            <div><div class="label">TSB (Forma)</div><div style="font-size:22px;font-weight:700;color:#E74C3C;margin-top:3px">−4</div></div>
          </div>
          <svg width="100%" height="50" viewBox="0 0 320 50" preserveAspectRatio="none">
            <polyline points="0,38 40,34 80,30 120,26 160,24 200,22 240,20 280,19 320,18"
              fill="none" stroke="#2980B9" stroke-width="2" opacity="0.9"/>
            <polyline points="0,20 40,24 80,30 120,35 160,38 200,40 240,36 280,32 320,30"
              fill="none" stroke="#E67E22" stroke-width="2" opacity="0.9"/>
          </svg>
          <div class="row" style="gap:16px;justify-content:center;margin-top:4px">
            <span style="font-size:11px;color:#2980B9">● CTL</span>
            <span style="font-size:11px;color:#E67E22">● ATL</span>
          </div>
        </div>

        <!-- Actividade recente -->
        <div class="section-hdr">
          <span class="title" style="font-size:14px">Actividade recente</span>
          <span class="subtitle" style="font-size:12px;color:#FF6B35">Ver histórico →</span>
        </div>
        ${[
          { sport:'Corrida leve', sub:'5.2 km · 28:14 · Z2 dominante', icon:'ti-run', color:'#27AE60', day:'Seg' },
          { sport:'Lower Body — Squat', sub:'8 exercícios · 52 min · 🏆 PR Squat', icon:'ti-barbell', color:'#FF6B35', day:'Dom' },
          { sport:'Ciclismo indoor', sub:'45 min · FTP 218W · 35.1 km', icon:'ti-bike', color:'#E67E22', day:'Sáb' },
        ].map(a => `
          <div class="int-row">
            <div class="int-icon" style="background:${a.color}20">
              <i class="ti ${a.icon}" style="color:${a.color}"></i>
            </div>
            <div class="col" style="flex:1">
              <span class="title" style="font-size:13px">${a.sport}</span>
              <span class="subtitle">${a.sub}</span>
            </div>
            <span class="subtitle" style="font-size:11px">${a.day}</span>
          </div>
          <div class="divider"></div>
        `).join('')}
        <div style="height:16px"></div>
      </div>`;
  }

  /* ─── REGISTO DE SESSÃO ─── */
  else if (id === 'record') {
    el.innerHTML = `
      <div class="screen-hdr" style="background:#0A0A0A">
        <div class="row-between">
          <div class="col">
            <div class="row" style="gap:6px">
              <span class="dot" style="background:#FF6B35"></span>
              <span class="label">Ginásio · Push A · Superset 1/3</span>
            </div>
            <span class="title" style="font-size:15px;margin-top:2px">Bench Press + Cable Fly</span>
          </div>
          <div class="col" style="align-items:flex-end">
            <span class="label">Duração</span>
            <span style="font-size:18px;font-weight:700;color:#FF6B35">24:38</span>
          </div>
        </div>
        <!-- Progress steps -->
        <div style="display:flex;gap:4px;margin-top:10px">
          ${['Bench Press','Cable Fly','OHP'].map((e,i) =>
            `<div style="flex:1;height:3px;border-radius:2px;background:${i<2?'#FF6B35':'#2E2E2E'}"></div>`
          ).join('')}
        </div>
      </div>

      <!-- Exercise info -->
      <div style="background:#111;padding:14px 18px;flex-shrink:0">
        <div class="row-between" style="margin-bottom:10px">
          <span class="title" style="font-size:17px">Bench Press</span>
          <span class="badge" style="background:#FF6B3520;color:#FF6B35">PR: 102.5kg×3</span>
        </div>
        <!-- GIF placeholder -->
        <div style="background:#1A1A1A;border-radius:14px;height:90px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;border:1px dashed #2E2E2E">
          <div style="text-align:center">
            <i class="ti ti-player-play" style="font-size:28px;color:#333"></i>
            <div style="font-size:11px;color:#444;margin-top:4px">Animação de execução</div>
          </div>
        </div>
        <!-- Inputs -->
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px">
          <div>
            <div class="label" style="text-align:center;margin-bottom:4px">Peso (kg)</div>
            <div class="input-box active">90</div>
          </div>
          <div>
            <div class="label" style="text-align:center;margin-bottom:4px">Reps</div>
            <div class="input-box active">8</div>
          </div>
          <div>
            <div class="label" style="text-align:center;margin-bottom:4px">RIR</div>
            <div class="input-box">2</div>
          </div>
        </div>
      </div>

      <!-- Sets -->
      <div class="scroll-area" style="padding:12px 18px">
        <span class="label" style="margin-bottom:10px;display:block">Sets — progresso</span>
        ${[
          { n:1, kg:85, reps:8, rir:2, state:'done' },
          { n:2, kg:90, reps:8, rir:2, state:'done' },
          { n:3, kg:90, reps:8, rir:2, state:'active' },
          { n:4, kg:90, reps:6, rir:3, state:'pending' },
        ].map(s => `
          <div class="set-row">
            <div class="set-num ${s.state}">${s.state==='done'?'✓':s.n}</div>
            <span style="flex:1;font-size:13px;color:${s.state==='done'?'#666':s.state==='active'?'#fff':'#888'}">${s.kg} kg × ${s.reps} reps</span>
            <span class="label">RIR ${s.rir}</span>
            ${s.state==='done'?'<i class="ti ti-check" style="color:#27AE60;font-size:16px"></i>':''}
          </div>`).join('')}
        <div style="margin-top:12px;padding:10px;border:1px dashed #2E2E2E;border-radius:10px;text-align:center;cursor:pointer">
          <span class="subtitle">+ Adicionar set</span>
        </div>
      </div>

      <!-- Rest timer + action -->
      <div style="padding:12px 18px 8px;background:#0A0A0A;border-top:1px solid #1E1E1E;flex-shrink:0">
        <div class="row-between">

              border:${f.done?'1px solid #2980B9':'1px dashed #2E2E2E'};cursor:pointer">
              <i class="ti ${f.done?'ti-check':'ti-camera'}" style="color:${f.done?'#2980B9':'#444'};font-size:20px"></i>
              <span style="font-size:11px;color:${f.done?'#2980B9':'#555'}">${f.l}</span>
            </div>`).join('')}
        </div>

        <!-- Medidas corporais -->
        <div class="section-hdr"><span class="title" style="font-size:14px">Medidas corporais</span></div>
        <div class="card" style="margin-bottom:16px">
          ${[
            { g:'Upper Body', items:[{l:'Cintura',v:'82 cm'},{l:'Ancas',v:'98 cm'},{l:'Peito',v:'104 cm'}] },
            { g:'Braços',     items:[{l:'Bicep D',v:'38 cm'},{l:'Bicep E',v:'37.5 cm'}] },
          ].map(g => `
            <div style="margin-bottom:8px">
              <div class="label" style="margin-bottom:6px">${g.g}</div>
              ${g.items.map(m => `
                <div class="row-between" style="padding:5px 0;border-bottom:1px solid #1E1E1E">
                  <span class="subtitle">${m.l}</span>
                  <span style="font-size:13px;font-weight:600;color:#fff">${m.v}</span>
                </div>`).join('')}
            </div>`).join('')}
          <button class="btn-secondary" style="width:100%;margin-top:8px;text-align:center">Ver todas as medidas</button>
        </div>
      </div>`;
  }
}

// Init
renderNav();
renderTabs('inicio');
renderScreen('dashboard');
</script>

</body>
</html>
